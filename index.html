<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Chat App</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #dce5ed;
}
.app {
  max-width: 650px;
  height: 100vh;
  margin: auto;
  background: white;
  display: flex;
  flex-direction: column;
}
header {
  background: #1685d1;
  color: white;
  padding: 16px;
  font-size: 21px;
  font-weight: bold;
}
#messages {
  flex: 1;
  overflow-y: auto;
  padding: 14px;
  background: #eaf1f7;
}
.message {
  background: white;
  padding: 10px 13px;
  margin: 8px 0;
  border-radius: 12px;
  overflow-wrap: anywhere;
}
.message b {
  display: block;
  color: #167ac6;
  margin-bottom: 5px;
}
.message small {
  display: block;
  color: #777;
  margin-top: 6px;
}
form {
  display: flex;
  gap: 7px;
  padding: 10px;
}
input {
  min-width: 0;
  padding: 12px;
  border: 1px solid #ccc;
  border-radius: 22px;
}
#username { width: 105px; }
#message { flex: 1; }
button {
  background: #1685d1;
  color: white;
  border: 0;
  border-radius: 22px;
  padding: 0 17px;
}
</style>
</head>
<body>
<div class="app">
<header>My Chat App</header>
<div id="messages"></div>

<form id="chatForm">
<input id="username" placeholder="Your name" required maxlength="30">
<input id="message" placeholder="Write a message..." required maxlength="1000">
<button type="submit">Send</button>
</form>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
const socket = io();
const form = document.getElementById("chatForm");
const username = document.getElementById("username");
const input = document.getElementById("message");
const messages = document.getElementById("messages");

function showMessage(data) {
  const div = document.createElement("div");
  div.className = "message";

  const name = document.createElement("b");
  name.textContent = data.name;

  const text = document.createElement("div");
  text.textContent = data.text;

  const time = document.createElement("small");
  time.textContent = data.time || "";

  div.append(name, text, time);
  messages.appendChild(div);
  messages.scrollTop = messages.scrollHeight;
}

socket.on("old messages", (old) => {
  messages.innerHTML = "";
  old.forEach(showMessage);
});

form.addEventListener("submit", (e) => {
  e.preventDefault();

  if (username.value.trim() && input.value.trim()) {
    socket.emit("chat message", {
      name: username.value.trim(),
      text: input.value.trim()
    });
    input.value = "";
  }
});

socket.on("chat message", showMessage);
</script>
</body>
</html>
